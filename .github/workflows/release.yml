name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.3.1
      - name: Build
        run: devenv shell cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          name="zoho-mail-sync-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/${name}"
          cp target/release/zoho-mail-sync "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
